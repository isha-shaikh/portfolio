<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Monogram favicon. Palette matches the site: void ground, gold-to-champagne
       gradient on the letterforms, mirroring the hero's emphasis line. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3B23C" />
      <stop offset="55%" stop-color="#F7D486" />
      <stop offset="100%" stop-color="#E3B23C" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#08080A" />

  <!-- Hairline gold frame, echoing the site's divider treatment. -->
  <rect
    x="2.5"
    y="2.5"
    width="59"
    height="59"
    rx="10.5"
    fill="none"
    stroke="#E3B23C"
    stroke-opacity="0.38"
    stroke-width="1.5"
  />

  <text
    x="32"
    y="44"
    fill="url(#gold)"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    letter-spacing="-1"
    text-anchor="middle"
  >IS</text>
</svg>
